<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラシック作曲家診断</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: "Yu Mincho", serif;
      background: linear-gradient(to bottom, #ffffff, #e6f0ff); 
      padding: 30px;
      color: #2c3e50;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 32px;
      border-bottom: 2px solid #999;
      padding-bottom: 10px;
    }
    .question {
      margin-bottom: 20px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #a3c2f2;
      cursor: pointer;
      border-radius: 5px;
      display: block; 
      width: 100%; 
      transition: transform 0.2s ease;
    }
    button:hover {
      background-color: #7aa9e6;
      transform: scale(1.05); 
    }
    img {
      max-width: 300px;
      border: 3px solid #555;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      margin-top: 20px;
    }
    #result {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>クラシック作曲家診断</h1>
    <p>この診断では、</p>
    <ul>
      <li><b>ベートーヴェン</b></li>
      <li><b>ブラームス</b></li>
      <li><b>チャイコフスキー</b></li>
      <li><b>シベリウス</b></li>
    </ul>
    <p>の中から、あなたの音楽的感性に最も近い作曲家を判定します。</p>
    <p>はじめますか？</p>
    <button onclick="startQuiz()">スタート</button>
  </div>

  <div id="quiz-screen" style="display:none;">
    <div id="quiz"></div>
    <div id="result"></div>
  </div>

  <script>
    const composers = ["ベートーヴェン", "チャイコフスキー", "ブラームス", "シベリウス"];
    const scores = {};
    composers.forEach(name => scores[name] = 0);

    const questions = [
      {
        text: "音楽に求めるものは？",
        options: {
          "魂を揺さぶる情熱": "チャイコフスキー",
          "知性と構造美": "ベートーヴェン",
          "深い感情と伝統の融合": "ブラームス",
          "自然との調和と静けさ": "シベリウス"
        }
      },
      {
        text: "あなたの性格に近いものは？",
        options: {
          "沈着冷静で自然を愛する": "シベリウス",
          "内向的で誠実": "ブラームス",
          "強い意志と探究心": "ベートーヴェン",
          "激しく感情的": "チャイコフスキー"
        }
      },
      {
        text: "創作において最も重視するものは？",
        options: {
          "伝統と内省的な美しさ": "ブラームス",
          "哲学的な深さと構造": "ベートーヴェン",
          "感情の爆発とドラマ性": "チャイコフスキー",
          "自然からの着想と静謐さ": "シベリウス"
        }
      },
      {
        text: "理想の作業環境は？",
        options: {
          "情熱的な演奏が響くホール": "チャイコフスキー",
          "孤独な部屋で思索にふける": "ベートーヴェン",
          "静かな森の中": "シベリウス",
          "都会の喧騒から離れた書斎": "ブラームス"
        }
      },
      {
        text: "芸術とは何か？",
        options: {
          "心の機微を映す鏡": "チャイコフスキー",
          "人間の深淵を探る旅": "ブラームス",
          "魂の叫びを形にする手段": "ベートーヴェン",
          "自然の美を音にすること": "シベリウス"
        }
      },
      {
        text: "音楽に触れる際、最も重視する要素は何か？",
        options: {
          "感情の高まり": "チャイコフスキー",
          "構造の明快さ": "ベートーヴェン",
          "精神的深さ": "ブラームス",
          "自然との調和": "シベリウス"
        }
      },
      {
        text: "創作において、最も重要と考える姿勢は？",
        options: {
          "情熱を率直に表現する": "チャイコフスキー",
          "理念に基づき構築する": "ベートーヴェン",
          "伝統を尊重し内省する": "ブラームス",
          "静寂の中で着想を得る": "シベリウス"
        }
      },
      {
        text: "音楽が語るべき主題として、最も共感するものは？",
        options: {
          "人間の感情": "チャイコフスキー",
          "自由と意志": "ベートーヴェン",
          "精神と歴史": "ブラームス",
          "自然と神話": "シベリウス"
        }
      },
      {
        text: "理想的な音楽の聴取環境は？",
        options: {
          "静かな自然の中": "シベリウス",
          "深夜の書斎": "ブラームス",
          "演奏会場の熱気": "チャイコフスキー",
          "孤独な空間での思索": "ベートーヴェン"
        }
      },
      {
        text: "音楽が持つべき本質とは何か？",
        options: {
          "感情の表出": "チャイコフスキー",
          "理念の体現": "ベートーヴェン",
          "精神の探究": "ブラームス",
          "自然の描写": "シベリウス"
        }
      }
    ];

    const composerData = {
      "ベートーヴェン": {
        image: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Beethoven.jpg",
        description: "ベートーヴェンは聴力を失いながらも、数々の名曲を生み出した不屈の作曲家である。彼は古典派からロマン派への橋渡しを担い、音楽に個人の感情と自由な表現を導入した。孤独で激しい気性を持ちつつも、人間の尊厳と理想を追求し続けた芸術家である。",
        works: [
          { title: "交響曲第5番『運命』", url: "https://youtu.be/a9UApyClFKA?si=aLhOwiE5SFc9KUgL" },
          { title: "交響曲第6番『田園』", url: "https://youtu.be/Zv4PIFRpYcw?si=_OabqrdEQoPdklUv" }, 
          { title: "交響曲第7番", url: "https://youtu.be/-4788Tmz9Zo?si=ck41wO7-yyHjpfGq" },
          { title: "ピアノソナタ第14番『月光』", url: "https://youtu.be/VHwoypAY52k?si=zT8hkAi__RnhaN3h" },
          { title: "ピアノ協奏曲第5番『皇帝』", url: "https://youtu.be/pEYajsa8NeM?si=5t0H1_1p7DTZt4AU" }
        ]
      },
      "チャイコフスキー": {
        image: "https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcT6-YfhF07M1k_LX0tdUytREE606KlUxozwbfi7QsAp92I41u2lGBxaQvDvndDAApH4zUj7mbqzSPh69jw",
        description: "感情豊かな旋律と華麗な管弦楽法で知られるロシアのロマン派作曲家である。 彼は繊細で内向的な性格を持ち、葛藤や孤独を音楽に昇華させた芸術家であった。 バレエ音楽や交響曲など多彩なジャンルで傑作を残し、世界中で高く評価されている。",
        works: [
          { title: "交響曲第5番", url: "https://youtu.be/1dsbkhTkD7s?si=Vt9FGn8-GFWTdn_Y" },
          { title: "交響曲第6番『悲愴』", url: "https://youtu.be/SVnF3x44rvU?si=0X_ZKNkRrNszBsKc" },
          { title: "『白鳥の湖』", url: "https://youtu.be/TrQ6pRhyinU?si=8VW6ppU7B34Uzkg7" },
          { title: "『くるみ割り人形』組曲", url: "https://youtu.be/aB1eMfylQhE?si=1czeCZ71nqj1wSce" },
          { title: "スラヴ行進曲", url: "https://www.youtube.com/watch?v=rgOCUUQ75HE" }
        ]
      },
      "ブラームス": {
        image: "https://ptna-assets.s3-ap-northeast-1.amazonaws.com/enc/person/282.jpg",
        description: "ロマン派に属しながらも古典的な形式美を重んじた、厳格で内省的な作曲家である。彼はベートーヴェンの後継者と称されるほど伝統への敬意が深く、交響曲の完成には20年もの歳月を費やす慎重さを持っていた。質素な生活を好み、名声よりも芸術の本質を追求した誠実な人物である。",
        works: [
          { title: "交響曲第1番", url: "https://youtu.be/51xDbdUFc8o?si=BXAE9yJeowwjczIy" },
          { title: "交響曲第4番", url: "https://youtu.be/o69YVL_XKJo?si=5zAV9-dTbRgVVTuG" },
          { title: "ハンガリー舞曲第5番", url: "https://youtu.be/QAMxkietiik?si=nh_1N-2gwHYkXBPU" },
          { title: "大学祝典序曲", url: "https://youtu.be/AgJhsa-wLNU?si=gD8P0MVVoFiYAVtf" },
          { title: "悲劇的序曲", url: "https://youtu.be/PUPVO3cFAWQ?si=JzTx9SkIrGZitRk_" }
        ]
      },
      "シベリウス": {
        image: "https://www.kiyama-music.com/wp-content/uploads/2022/03/Jean_Sibelius_1913-768x1024.jpeg",
        description: "シベリウスはフィンランドの自然や神話に深く影響を受けた作曲家であり、民族的アイデンティティを音楽で表現した。内向的で孤高な性格を持ち、晩年は創作から距離を置きながらも国民的英雄として尊敬された。彼の音楽は厳格で構築的な美しさを持ち、フィンランドの精神を象徴する存在となった。",
        works: [
          { title: "交響曲第2番", url: "https://youtu.be/iXU8EXL7a_4?si=Tzlk-BiIn58aPM9M" },
          { title: "交響曲第5番", url: "https://youtu.be/EcjvvBbZhn4?si=dEpHfbGgLg9fezsJ" },
          { title: "フィンランディア", url: "https://youtu.be/fE0RbPsC9uE?si=f8QpEe3s770AKzf4" },
          { title: "ヴァイオリン協奏曲 ニ短調", url: "https://youtu.be/J0w0t4Qn6LY?si=heeq63GCnDhjhOPm" },
          { title: "悲しきワルツ", url: "https://youtu.be/aihaQHzGZGQ?si=5BNDdDn-vNRrgOBl" }
        ]
      }
    };

    let current = 0;

    function startQuiz() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      const q = questions[current];
      const quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = `<div class="question"><strong>${q.text}</strong></div>`;
      for (const [text, composer] of Object.entries(q.options)) {
        const btn = document.createElement("button");
        btn.textContent = text;
        btn.onclick = () => {
          scores[composer]++;
          current++;
          if (current < questions.length) {
            showQuestion();
          } else {
            showResult();
          }
        };
        quizDiv.appendChild(btn);
      }
    }

    function showResult() {
      const resultDiv = document.getElementById("result");
      const topComposer = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
      const data = composerData[topComposer];

            resultDiv.innerHTML = `
  　          <div style="background: linear-gradient(to right, #fdf6e3, #e0dcc3); padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2);">
                <h2 style="color: #2c3e50; border-bottom: 2px solid #999; padding-bottom: 5px;">おすすめ作曲家：${topComposer}</h2>
                <img src="${data.image}" alt="${topComposer}">
                <p><strong>人物像：</strong>${data.description}</p>
                <p><strong>代表作品：</strong></p>
                <ul style="list-style-type: square; padding-left: 20px;">
                  ${data.works.map(work => `<li><a href="${work.url}" target="_blank">${work.title}</a></li>`).join("")}
                </ul>
                <p style="margin-top: 20px;">あなたの音楽的感性は、<strong>${topComposer}</strong>の芸術と深く響き合っています。<br>  
                その旋律は、あなたの心に新たな世界を開いてくれることでしょう。</p>
                <canvas id="scoreRadar" width="300" height="300" style="margin-top: 30px;"></canvas>
                <button onclick="saveResult()" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; background-color: #f7c873; color: black; border: none; border-radius: 5px; cursor: pointer;">結果画面を保存<br>※肖像画は含まれません</button>
              </div>
            `; 
            const canvas = document.getElementById("scoreRadar");
            new Chart(canvas, {
              type: "radar",
              data: {
                labels: Object.keys(scores),
                datasets: [{
                  label: "一致度",
                  data: Object.values(scores),
                  backgroundColor: "rgba(100, 149, 237, 0.3)",
                  borderColor: "rgba(25, 25, 112, 1)",         
                  borderWidth: 2,
                  pointBackgroundColor: "#191970"
                }]
              },
              options: {
                scales: {
                  r: {
                    beginAtZero: true,
                    max: 10,
                    ticks: {
                      stepSize: 1
                    }
                  }
                }
              }
            });
            document.getElementById("quiz").innerHTML = "";
          }

        function saveResult() {
          const resultDiv = document.getElementById("result");
          html2canvas(resultDiv, {
            ignoreElements: (element) => element.tagName === "IMG"
          }).then(canvas => {
            const link = document.createElement("a");
            link.download = "composer_result.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
          });
        }
        </script>
      </body>
      </html>
